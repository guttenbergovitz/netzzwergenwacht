name: Rust CI

on:
  push:
    branches: [rewrite/rust, develop, main]
  pull_request:
    branches: [rewrite/rust, develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --locked
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Verify release build
        run: cargo build --release --locked

  live-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
      - name: Install CDP client
        run: npm install --no-save ws
      - name: Run live Chromium collector tests
        env:
          NZW_CHROMIUM_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NZW_ALLOW_UNSAFE_BROWSER_SANDBOX: "1"
        run: >-
          cargo test --locked
          --test sensory_collectors_live
          --test browser_timeline
          -- --ignored --test-threads=1

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
