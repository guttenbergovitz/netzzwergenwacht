# OpenAI (or an OpenAI-compatible gateway).
# `api_key_env` names the variable that holds the key; it does not contain the key.

[models.default]
provider = "openai"
model = "your-model-id"
api_key_env = "OPENAI_API_KEY"

[budget]
audit_timeout_secs = 90
http_timeout_secs = 20
max_redirects = 5
max_response_bytes = 10485760
max_concurrency = 4
