version: "3"

# Primary developer entrypoint for NetzZwergenWacht.
#
# `task setup` prepares a fresh clone, `task doctor` reports which local
# instruments are available, and `task check` runs the engineering quality gate.
# Note the distinction: `task check` validates the codebase, while `nzw check URL`
# runs a single-page audit and `task scan URL=…` crawls an application and retains
# its evidence.
#
# Every implementation wave updates this file: a capability that can only be
# exercised by remembering Cargo incantations is not delivered.
#
# Task arguments follow one convention: the thing being inspected is always
# `URL`, whether the task audits one page, crawls an application or opens the
# workbench. `TARGET` is accepted as a legacy alias by the entry-point tasks and
# will be removed once callers have migrated.

vars:
  BIN: nzw
  INSTALL_DIR: '{{.HOME}}/.cargo/bin'
  DEFAULT_URL: https://example.org

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Prepare a fresh clone (dependency check, toolchain hints, local configuration)
    cmds:
      - cmd: rustc --version
        ignore_error: true
      - cmd: cargo --version
        ignore_error: true
      - cmd: node --version
        ignore_error: true
      - echo "Building the workspace so the first run is fast…"
      - cargo fetch --locked
      - cargo build --locked
      - echo "Run 'task doctor' to verify Chromium, Node.js, axe, Lighthouse and configuration."

  doctor:
    desc: Report which local instruments and configuration are available
    cmds:
      - cargo run --quiet --locked -- doctor

  dev:
    desc: Build and run the workbench against a target URL (URL=https://example.org)
    cmds:
      - cargo run --quiet --locked -- tui {{.URL | default .TARGET | default .DEFAULT_URL}}

  tui:
    desc: Build and run the Zwergenleitstand workbench (URL default https://example.org)
    cmds:
      - cargo run --quiet --locked -- tui {{.URL | default .TARGET | default .DEFAULT_URL}}

  tui:scan:
    desc: Crawl an application inside the workbench and retain the evidence (URL default https://example.org)
    cmds:
      - cargo run --quiet --locked -- tui {{.URL | default .TARGET | default .DEFAULT_URL}} --mode scan --max-pages {{.MAX_PAGES | default 50}} --max-depth {{.MAX_DEPTH | default 2}}

  run:
    desc: Run a deterministic single-page audit (URL required, e.g. task run URL=https://example.org)
    requires:
      vars: [URL]
    cmds:
      - cargo run --quiet --locked -- check {{.URL}}

  scan:
    desc: Crawl an application, retain its evidence and report coverage (URL required)
    requires:
      vars: [URL]
    cmds:
      - cargo run --release --locked -- scan {{.URL}} --max-pages {{.MAX_PAGES | default 50}} --max-depth {{.MAX_DEPTH | default 2}}

  scan:private:
    desc: Crawl a loopback or private target, bypassing the public-only policy (URL required)
    requires:
      vars: [URL]
    cmds:
      - cargo run --release --locked -- scan {{.URL}} --allow-private --max-pages {{.MAX_PAGES | default 50}} --max-depth {{.MAX_DEPTH | default 2}}

  fmt:
    desc: Format all Rust source files
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Verify Rust formatting matches rustfmt
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run Clippy with strict workspace lints
    cmds:
      - cargo clippy --all-targets --locked -- -D warnings

  test:
    desc: Run the full Rust test suite
    cmds:
      - cargo test --all-targets --locked

  test:tui:
    desc: Run the Zwergenleitstand rendering, navigation and crawl-projection tests
    cmds:
      - "cargo test --locked --lib tui::"
      - "cargo test --locked --test zwergenleitstand_tui"

  test:integration:
    desc: Run the integration suites only
    cmds:
      - cargo test --locked --tests

  test:browser:
    desc: Run the ignored Chromium suites (requires a local Chrome/Chromium and Node.js 22+)
    env:
      NZW_CHROMIUM_BIN: '{{.NZW_CHROMIUM_BIN | default "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"}}'
    cmds:
      - cargo test --locked --test sensory_collectors_live --test browser_timeline -- --ignored --test-threads=1

  test:crawler:
    desc: Run the concurrent crawler, frontier, robots and subresource suites
    cmds:
      - "cargo test --locked --lib discovery::"

  test:store:
    desc: Run the evidence store, migration and schema suites
    cmds:
      - "cargo test --locked --lib evidence_store::"

  test:recon:
    desc: Run the end-to-end reconnaissance pipeline (crawl, analyse, persist, query)
    cmds:
      - cargo test --locked --test reconnaissance_pipeline

  bench:store:
    desc: Compare Turso with batched SQLite over identical populations (release, ignored)
    cmds:
      - cargo test --release --locked --test evidence_store_spike -- --ignored --nocapture --test-threads=1

  bench:crawler:
    desc: Measure crawl wall clock at concurrency 1 and 4 over a loopback fixture (release, ignored)
    cmds:
      - cargo test --release --locked --test crawler_benchmark -- --ignored --nocapture

  doc:
    desc: Build API documentation and fail on broken intra-doc links
    env:
      RUSTDOCFLAGS: "-D warnings"
    cmds:
      - cargo doc --no-deps --locked

  check:
    desc: Run the full CI quality gate (format, clippy, rustdoc, and tests)
    deps:
      - fmt:check
      - lint
      - doc
      - test

  check:all:
    desc: Run the engineering gate plus the release build
    cmds:
      - task: check
      - task: build

  build:
    desc: Build an optimised release binary
    cmds:
      - cargo build --release --locked

  install:
    desc: Install the nzw binary into ~/.cargo/bin
    cmds:
      - cargo install --path . --locked --force

  uninstall:
    desc: Remove the installed nzw binary
    cmds:
      - rm -f {{.INSTALL_DIR}}/{{.BIN}}

  audit:
    desc: Run cargo-audit security advisory check
    cmds:
      - cargo audit

  clean:
    desc: Remove build artefacts
    cmds:
      - cargo clean
