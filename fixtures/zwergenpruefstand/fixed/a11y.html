<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zwergenprüfstand — Fixed Accessibility</title>
  <meta name="description" content="Remediated form page.">
</head>
<body>
  <main>
    <h1>Account Enquiry</h1>
    <img src="/banner.png" alt="Account banner">
    <form>
      <label for="email">Email</label>
      <input type="text" id="email">
      <span id="submit-label">Submit enquiry</span>
      <button aria-labelledby="submit-label">Submit</button>
    </form>
  </main>
</body>
</html>
