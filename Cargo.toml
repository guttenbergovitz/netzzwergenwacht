[package]
name = "netzzwergenwacht"
version = "0.2.0-alpha.0"
edition = "2024"
rust-version = "1.88"
description = "Evidence-driven external web quality and reliability auditing engine with optional AI-assisted analysis."
license = "MIT"
repository = "https://github.com/guttenbergovitz/netzzwergenwacht"
readme = "README.md"
publish = false

[[bin]]
name = "nzw"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rig-core = { version = "0.42.0", features = ["reqwest"] }
schemars = "0.8"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
whatlang = "0.17"
x509-parser = "0.17"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
clone_on_ref_ptr = "deny"
